version: 2

updates:
  # Keep GitHub Actions references current, including immutable SHA pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
      include: scope

  # The root Cargo manifest has no external dependencies. These two nested
  # crates do use external crates and maintain their own Cargo.lock files.
  - package-ecosystem: cargo
    directory: /contrib/libgit-rs
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "build(deps)"
      include: scope

  - package-ecosystem: cargo
    directory: /contrib/libgit-sys
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "build(deps)"
      include: scope
